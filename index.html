<!-- ============================================================
     APP ROOT
============================================================ -->
<div id="app">

  <!-- Decorative fixed backdrop shared across scenes -->
  <div class="backdrop" aria-hidden="true">
    <svg class="backdrop-corner backdrop-corner--tl" viewBox="0 0 66 66"><use href="#art-corner-flourish"/></svg>
    <svg class="backdrop-corner backdrop-corner--br" viewBox="0 0 66 66"><use href="#art-corner-flourish"/></svg>
  </div>

  <!-- Back control -->
  <button id="backBtn" class="back-btn" aria-label="Go back" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="back-btn__label"></span>
  </button>

  <!-- Music control — appears once the card has been opened; starts hidden
       so it never shows on the language or sealed-invitation screens.
       Music itself only ever starts from the tap that opens the card. -->
  <button id="musicToggle" class="music-toggle" aria-label="Mute music" hidden>
    <span class="music-toggle__icon" aria-hidden="true">&#9834;</span>
  </button>

  <!-- ============ PAGE 1 — LANGUAGE ============ -->
  <section class="scene scene--lang is-active" data-scene="lang">
    <div class="scene__inner">
      <svg class="lang-flourish" viewBox="0 0 66 66" aria-hidden="true"><use href="#art-corner-flourish"/></svg>
      <p class="eyebrow-names eyebrow-names--lang">Dhiraj <span class="amp">&#10084;</span> Tanu</p>
      <p class="lang-subtitle">
        <span>Our Wedding Invitation</span>
        <span class="lang-subtitle__hi">हमारे विवाह का निमंत्रण</span>
      </p>
      <div class="lang-choice">
        <button class="lang-btn" data-lang="hi">हिंदी</button>
        <button class="lang-btn" data-lang="en">ENGLISH</button>
      </div>
    </div>
  </section>

  <!-- ============ PAGE 2 — SEALED INVITATION / TAP TO OPEN ============ -->
  <section class="scene scene--seal" data-scene="seal">
    <div class="scene__inner scene__inner--seal">
      <div class="invite-card" id="inviteCard">
        <svg class="invite-card__corner invite-card__corner--tl" viewBox="0 0 66 66" aria-hidden="true"><use href="#art-corner-flourish"/></svg>
        <svg class="invite-card__corner invite-card__corner--br" viewBox="0 0 66 66" aria-hidden="true"><use href="#art-corner-flourish"/></svg>
        <div class="invite-seal">
          <span class="invite-seal__mono">D<span class="invite-seal__heart">&#10084;</span>T</span>
        </div>
        <p class="invite-card__names">
          <span data-text-name="groom"></span><span class="amp">&amp;</span><span data-text-name="bride"></span>
        </p>
      </div>
      <p class="tap-hint tap-hint--open" data-text="tapToOpen"></p>
    </div>
  </section>

  <!-- ============ PAGE 3 — MAIN COUPLE REVEAL ============ -->
  <section class="scene scene--couple" data-scene="couple">
    <div class="scene__inner">
      <p class="ganesha-line" data-text="ganesha"></p>
      <p class="blessing blessing--eyebrow" data-text="openingBlessing"></p>
      <div class="photo-frame photo-frame--arch photo-frame--faces-top">
        <img src="assets/couple-page3.jpg" alt="" />
        <svg class="photo-frame__corner photo-frame__corner--tl" viewBox="0 0 24 24" aria-hidden="true"><use href="#art-blossom"/></svg>
        <svg class="photo-frame__corner photo-frame__corner--br" viewBox="0 0 24 24" aria-hidden="true"><use href="#art-blossom"/></svg>
      </div>
      <h1 class="names names--stacked">
        <span class="name" data-text-name="groom"></span>
        <span class="amp">&amp;</span>
        <span class="name" data-text-name="bride"></span>
      </h1>
      <div class="couple-parents">
        <div class="couple-parents__row">
          <p class="couple-parents__name" data-text-name="groom"></p>
          <p class="couple-parents__rel" data-parent="groom"></p>
        </div>
        <div class="couple-parents__row">
          <p class="couple-parents__name" data-text-name="bride"></p>
          <p class="couple-parents__rel" data-parent="bride"></p>
        </div>
      </div>
      <p class="tap-hint" data-text="tapToContinue"></p>
    </div>
  </section>

  <!-- ============ PAGE 4 — MANAS PATH ============ -->
  <section class="scene scene--event scene--manas" data-scene="manas">
    <div class="scatter" aria-hidden="true">
      <svg class="scatter-icon scatter-icon--1" viewBox="0 0 48 40"><use href="#art-diya"/></svg>
    </div>
    <div class="scene__inner">
      <svg class="event-motif event-motif--havan" viewBox="0 0 140 70" aria-hidden="true"><use href="#art-havan"/></svg>
      <h2 class="event-title" data-event="manas" data-field="title"></h2>
      <div class="event-details">
        <p class="event-date" data-event="manas" data-field="date"></p>
      </div>
      <div class="event-venue">
        <p class="venue-name" data-event="manas" data-field="venue"></p>
        <p class="venue-address" data-address="home"></p>
      </div>
      <p class="tap-hint" data-text="tapToContinue"></p>
    </div>
  </section>

  <!-- ============ PAGE 5 — MEHNDI & SANGEET ============ -->
  <section class="scene scene--event scene--mehndi" data-scene="mehndi">
    <div class="effect-layer" aria-hidden="true"></div>
    <div class="scatter" aria-hidden="true">
      <svg class="scatter-icon scatter-icon--1" viewBox="0 0 42 46"><use href="#art-paisley"/></svg>
      <svg class="scatter-icon scatter-icon--2" viewBox="0 0 42 46"><use href="#art-paisley"/></svg>

      <svg class="event-motif" viewBox="0 0 42 46" aria-hidden="true"><use href="#art-paisley"/></svg>
      <h2 class="event-title" data-event="mehndi" data-field="title"></h2>
      <div class="event-details">
        <p class="event-date" data-event="mehndi" data-field="date"></p>
        <p class="event-day"  data-event="mehndi" data-field="day"></p>
        <p class="event-time" data-event="mehndi" data-field="time"></p>
      </div>
      <div class="photo-frame photo-frame--round photo-frame--illustrated">
        <svg class="frame-illustration" viewBox="0 0 64 76" aria-hidden="true"><use href="#art-mehndi-scene"/></svg>
      </div>
      <div class="event-venue">
        <p class="venue-name" data-event="mehndi" data-field="venue"></p>
        <p class="venue-address" data-address="home"></p>
      </div>
      <p class="tap-hint" data-text="tapToContinue"></p>
    </div>
  </section>

  <!-- ============ PAGE 6 — HALDI ============ -->
  <section class="scene scene--event scene--haldi" data-scene="haldi">
    <div class="effect-layer" aria-hidden="true"></div>
    <div class="scatter" aria-hidden="true">
      <svg class="scatter-icon scatter-icon--1" viewBox="0 0 40 40"><use href="#art-marigold"/></svg>
      <svg class="scatter-icon scatter-icon--2" viewBox="0 0 40 40"><use href="#art-marigold"/></svg>
      <svg class="scatter-icon scatter-icon--3" viewBox="0 0 40 40"><use href="#art-marigold"/></svg>
    </div>
    <div class="scene__inner">
      <svg class="event-motif event-motif--marigold" viewBox="0 0 40 40" aria-hidden="true"><use href="#art-marigold"/></svg>
      <h2 class="event-title" data-event="haldi" data-field="title"></h2>
      <div class="event-details">
        <p class="event-date" data-event="haldi" data-field="date"></p>
        <p class="event-day"  data-event="haldi" data-field="day"></p>
        <p class="event-time" data-event="haldi" data-field="time"></p>
      </div>
      <div class="photo-frame photo-frame--round photo-frame--illustrated photo-frame--haldi">
        <svg class="frame-illustration" viewBox="0 0 80 70" aria-hidden="true"><use href="#art-haldi-scene"/></svg>
      </div>
      <div class="event-venue">
        <p class="venue-name" data-event="haldi" data-field="venue"></p>
        <p class="venue-address" data-address="home"></p>
      </div>
      <p class="tap-hint" data-text="tapToContinue"></p>
    </div>
  </section>

  <!-- ============ PAGE 7 — SHUBH VIVAH ============ -->
  <section class="scene scene--event scene--wedding" data-scene="wedding">
    <div class="effect-layer" aria-hidden="true"></div>
    <div class="scatter" aria-hidden="true">
      <svg class="scatter-icon scatter-icon--1" viewBox="0 0 24 24"><use href="#art-blossom"/></svg>
      <svg class="scatter-icon scatter-icon--2" viewBox="0 0 24 24"><use href="#art-blossom"/></svg>
    </div>
    <div class="scene__inner">
      <div class="mandap-frame">
        <svg class="mandap-arch-art" viewBox="-6 -18 132 108" aria-hidden="true"><use href="#art-mandap-arch"/></svg>
        <div class="photo-frame photo-frame--arch photo-frame--mandap photo-frame--faces-top">
          <img src="assets/couple-page7.jpg" alt="" />
        </div>
      </div>
      <h1 class="names names--inline">
        <span class="name" data-text-name="groom"></span>
        <span class="amp">&amp;</span>
        <span class="name" data-text-name="bride"></span>
      </h1>
      <h2 class="event-title event-title--vivah" data-event="wedding" data-field="title"></h2>
      <div class="event-details">
        <p class="event-date" data-event="wedding" data-field="date"></p>
        <p class="event-day"  data-event="wedding" data-field="day"></p>
        <p class="event-time" data-event="wedding" data-field="time"></p>
      </div>
      <p class="venue-name venue-name--vivah" data-event="wedding" data-field="venue"></p>
      <p class="venue-address" data-event="wedding" data-field="address"></p>
      <p class="barat-line" data-text="baratLine"></p>
      <div class="divider-ornament" aria-hidden="true"><span class="divider-ornament__dot"></span></div>
      <p class="tap-hint" data-text="tapToContinue"></p>
    </div>
  </section>

  <!-- ============ PAGE 8 — OUR LITTLE STARS ============ -->
  <section class="scene scene--stars" data-scene="stars">
    <div class="scene__inner">
      <svg class="stars-art" viewBox="0 0 160 110" aria-hidden="true"><use href="#art-kids"/></svg>
      <h2 class="event-title" data-text="starsTitle"></h2>
      <p class="stars-names" id="starsNames"></p>
      <p class="stars-message" data-text="starsMessage"></p>
      <p class="tap-hint" data-text="tapToContinue"></p>
    </div>
  </section>

  <!-- ============ PAGE 9 — FINAL PRACTICAL PAGE ============ -->
  <section class="scene scene--final" data-scene="final">
    <div class="scene__inner">
      <svg class="opening-art opening-art--small" viewBox="-5 -10 140 190" aria-hidden="true"><use href="#art-couple"/></svg>
      <p class="blessing" data-text="finalBlessing"></p>
      <div class="action-row">
        <button class="pill-btn pill-btn--primary" id="mapsBtnFinal" data-text="openMaps"></button>
        <button class="pill-btn" id="calendarBtnFinal" data-text="addCalendar"></button>
      </div>
      <div class="divider-ornament" aria-hidden="true"><span class="divider-ornament__dot"></span></div>
      <p class="with-love" data-text="withLove"></p>
      <h1 class="names names--stacked names--final">
        <span class="name" data-text-name="groom"></span>
        <span class="amp">&amp;</span>
        <span class="name" data-text-name="bride"></span>
      </h1>
      <div class="contact-line">
        <p class="contact-line__label" data-text="contactsLabel"></p>
        <p class="contact-line__row" id="contactRow0"></p>
        <p class="contact-line__row" id="contactRow1"></p>
      </div>
    </div>
  </section>

</div>

<!-- Soft light-sweep layer used briefly during each cinematic page
     transition. Fixed and empty otherwise — no visual effect until
     script.js toggles .is-active on it. -->
<div id="transitionVeil" class="transition-veil" aria-hidden="true"></div>

<!-- Wedding music: single persistent element, loaded ahead of time
     (preload="auto") so it is ready to start the instant the visitor
     taps the seal on Page 2 — it never plays before that tap. -->
<audio id="bgMusic" src="sahilmadan-wedding-invitation-421393.mp3" loop preload="auto"></audio>

<script src="config.js"></script>
<script src="script.js"></script>
